<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vercel 初始化测试页</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--muted:#94a3b8;color-scheme:dark}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    body{background:linear-gradient(180deg,#071024 0%,#081426 100%);display:flex;align-items:center;justify-content:center;padding:32px;color:#e6eef6}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:28px;border-radius:12px;max-width:820px;width:100%;box-shadow:0 10px 30px rgba(2,6,23,0.6)}
    h1{margin:0 0 8px;font-size:28px}
    p.lead{margin:0 0 18px;color:var(--muted)}
    ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    li{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
    code{background:rgba(2,6,23,0.6);padding:3px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Monospace}
    a.button{display:inline-block;margin-top:16px;padding:10px 14px;border-radius:8px;background:linear-gradient(90deg,var(--accent),#7c3aed);color:#001; font-weight:600;text-decoration:none}
    footer{margin-top:18px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Vercel 初始化测试页 damn ✅</h1>
    <p class="lead">一个用于快速验证 Vercel 部署、路由与静态页面加载的简单主页。部署后你可以看到运行时间、请求路径与浏览器信息。</p>

    <ul>
      <li>
        <strong>部署时间</strong>
        <div id="time">加载中...</div>
      </li>
      <li>
        <strong>请求路径</strong>
        <div><code id="path">/</code></div>
      </li>
      <li>
        <strong>浏览器信息</strong>
        <div><code id="ua">Unknown</code></div>
      </li>
      <li>
        <strong>帮助</strong>
        <div>查看 <a href="https://vercel.com/docs" target="_blank" rel="noreferrer">Vercel 文档</a> 获取部署步骤。</div>
      </li>
    </ul>

    <a class="button" href="https://vercel.com/new" target="_blank" rel="noreferrer">在 Vercel 新建项目 ✨</a>

    <footer>
      Tips: 在项目根目录运行 <code>vercel</code> 或从 Vercel 网站选择仓库并部署。需要我帮你添加 `vercel.json` 或 API 示例吗？
    </footer>
  </div>

  <script>
    // 简单的客户端信息显示，便于验证部署是否最新
    document.getElementById('time').textContent = new Date().toLocaleString();
    document.getElementById('path').textContent = location.pathname || '/';
    document.getElementById('ua').textContent = navigator.userAgent;
  </script>
</body>
</html>
